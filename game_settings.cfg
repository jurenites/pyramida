; GAME SETTINGS — edit this file and restart the game.
; Each [section] names the part of the game the settings belong to.
; Times are simulation seconds at 1x speed. Lower seconds = faster work.
; Write seconds as decimals (3.0, 360.0); item counts stay whole numbers (1, 12).
; Keep fractional times (1.5) and constant expressions (day_seconds * 2).
; Multipliers use percentage changes: +50% = 1.5x, 0% = 1x, -90% = 0.1x.
; Write percentages without quotes as a whole value, only for *_multiplier keys.
; References to these settings use the resulting multiplier in calculations.
; Keep section and key names unchanged.
; Missing settings use defaults; invalid numbers produce a Godot warning.
; Values can reference other settings with + - * / and parentheses, without quotes.
; Local names or general constants work anywhere; explicit names also work:
; general.day_seconds, gathering.tree.seconds_per_action. Order does not matter.

[general]
; One complete day and night.
day_seconds = 360.0
; Overall labour bonus. +100% means twice as fast.
work_speed_multiplier = 0%
; Additional bonus from a completed workshop; does not stack.
workshop_speed_multiplier = +50%
; Metres per second; roads multiply this speed.
walk_speed = 2.25
road_speed_multiplier = +35%
; Time spent sowing, watering, and eating.
sowing_seconds = 3.0
watering_seconds = 1.5
eating_seconds = 2.0
; Growth in full light; hay fields always have four harvestable quarters.
crop_growth_seconds = 24.0
tree_growth_seconds = 96.0
palm_growth_seconds = 120.0
bush_seedling_seconds = 24.0
shade_growth_multiplier = -90%
; Two complete days between individual berries, expressed in seconds.
berry_regrowth_seconds = day_seconds * 2
; Births still require food and housing. Childhood lasts three days, in seconds.
birth_interval_seconds = 120.0
childhood_seconds = day_seconds * 3

[construction]
; Each value is work seconds PER MATERIAL delivered to this building.
; Example: house = 1.0 halves the default house construction labour.
; Walking/fetching time is additional. Applies to upgrades and reconstruction.
; Dismantling keeps its own existing timing.
platform = 2.0
stairs = 2.0 ; Ladder
garden = 2.0 ; Legacy garden
soil_bed = 2.0 ; Soil garden bed
stockpile = 2.0 ; Pile
goods_rack = 2.0 ; Pottery rack
small_warehouse = 2.0
stone_storage = 2.0
waterworks = 2.0
house = 2.0
hay_field = 2.0
windmill = 2.0
road = 2.0
well = 2.0
school = 2.0
pantry = 2.0
log_shed = 2.0
hay_barn = 2.0
sawmill = 2.0
mine_camp = 2.0
masonry = 2.0 ; Stone mason
workshop = 2.0

; GATHERING — each completed action collects ONE existing item.
; Only work time is configurable. Empty sources cannot produce items.
; Seconds: at least 0.001.

[gathering.tree]
; Tree or palm logs.
seconds_per_action = 3.0

[gathering.berry]
; Bush berries.
seconds_per_action = 3.0

[gathering.stone]
; Raw stone.
seconds_per_action = 3.0

[gathering.water]
seconds_per_action = 3.0

[gathering.hay]
; Each item clears one hay-field quarter.
seconds_per_action = 3.0

[gathering.vegetables]
seconds_per_action = 3.0

[gathering.grass]
; Legacy grass patches.
seconds_per_action = 3.0

; PRODUCTION — consumes one input item per batch.
; Automatic workers stop at automatic_stock_target; assigned workers may continue.
; Workplace tier bonuses and hunger penalties still apply.

[production.sawmill]
; One log into planks.
seconds_per_batch = 5.0
output_items = 1
automatic_stock_target = 12

[production.windmill]
; One hay into food.
seconds_per_batch = 4.0
output_items = 3
automatic_stock_target = 24

[production.masonry]
; One raw stone into finished blocks.
seconds_per_batch = 6.0
output_items = 1
automatic_stock_target = 12

; SAVES: existing jobs keep their assigned duration; collected cargo stays intact.
; Gathering always collects one item; production keeps its assigned batch yield.
; New jobs use these settings. Growth and overall speed change after restart.
; Settings apply to both landscapes and all save slots.
; Construction costs, storage capacities, total natural stocks and geography
; still belong to their existing game systems.

